{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<h1>{{ 'Please check your input' if status == 400 else 'Something went wrong' }}</h1>
<p role="alert">{{ message }}</p>
<p><a href="javascript:history.back()">Go back</a> or return to the <a href="{{ url_for('index') }}">home page</a>.</p>
{% endblock %}
